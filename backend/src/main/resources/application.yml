spring:
  application:
    name: jobcoach
  config:
    import: optional:file:../.env[.properties]
server:
  port: 8080
jobcoach:
  web:
    allowed-origin: ${JOBCOACH_ALLOWED_ORIGIN:http://localhost:5173}
  ai:
    provider: ${AI_PROVIDER:fake}
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:25s}
