services:
  mysql:
    image: mysql:8.4
    container_name: jobcoach-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jobcoach
      MYSQL_USER: jobcoach_app
      MYSQL_PASSWORD: change_me_locally
      MYSQL_ROOT_PASSWORD: change_root_locally
    ports:
      - "3306:3306"
    volumes:
      - jobcoach_mysql_data:/var/lib/mysql

volumes:
  jobcoach_mysql_data:
